services:
  - type: web
    name: opportunity-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium"
    startCommand: "cd backend && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -c gunicorn.conf.py"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./jobscractecher.db
      - key: ALLOWED_ORIGINS
        value: https://opportunity-frontend.onrender.com

  - type: web
    name: opportunity-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://opportunity-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
